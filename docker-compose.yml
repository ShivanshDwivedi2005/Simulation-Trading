services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simulation_trading}
      POSTGRES_USER: ${POSTGRES_USER:-simtrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simtrade-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simtrade} -d ${POSTGRES_DB:-simulation_trading}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-simtrade}:${POSTGRES_PASSWORD:-simtrade-local-only}@postgres:5432/${POSTGRES_DB:-simulation_trading}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      ALPACA_TRADING_REST_URL: ${ALPACA_TRADING_REST_URL:-https://paper-api.alpaca.markets}
      ALPACA_DATA_REST_URL: ${ALPACA_DATA_REST_URL:-https://data.alpaca.markets}
      ALPACA_DATA_WS_URL: ${ALPACA_DATA_WS_URL:-wss://stream.data.alpaca.markets/v2/iex}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_MAX_STREAM_SYMBOLS: ${ALPACA_MAX_STREAM_SYMBOLS:-30}
      ALPACA_ASSET_SYNC_INTERVAL_HOURS: ${ALPACA_ASSET_SYNC_INTERVAL_HOURS:-24}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-SimTrade <no-reply@localhost>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_PEPPER: ${OTP_PEPPER:-development-only-change-me}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/market
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
